<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Grid Game Architecture Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
    </header>

    <main id="game-board" class="grid-board"></main>
  </div>

  <dialog id="tile-menu" class="centered-menu">
    <form method="dialog" class="menu-form">
      <h3>Modify Tile State</h3>
      <div class="options-container">

        <!-- Unset -->
        <button type="submit" name="terrain" value="unset" class="menu-option option-unset" title="Reset this tile to an unassigned state.">
          <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11,7H13V11H17V13H13V17H11V13H7V11H11V7Z"/></svg>
          <span>Unset</span>
        </button>

        <!-- Dungeon Room -->
        <button type="submit" name="terrain" value="dungeon-room" class="menu-option option-dungeon-room" title="Draw a Dungeon card">
          <img src="./images/tiles/dchoaub-a8c150c3-f229-4127-a85a-6f23fcef5dfd/00.png" alt="Dungeon Room">
        </button>

        <!-- Bottomless Pit -->
        <button type="submit" name="terrain" value="bottomless-pit" class="menu-option option-bottomless-pit" title="Test Luck or fall to your doom">
          <img src="./images/tiles/dcii6b4-7b7a6615-f179-4783-9a5a-d73c79026d22/08.png" alt="Bottomless Pit">
          <span>Bottomless Pit</span>
        </button>

        <!-- Catacomb Entrance -->
        <button type="submit" name="terrain" value="catacomb-entrance" class="menu-option option-catacomb-entrance" title="Draw a Dungeon card and optionally enter Catacombs">
          <img src="./images/tiles/dcizgt9-df025130-02d7-4c89-b78f-f3bbac994e5d/02.png" alt="Catacomb Entrance">
          <span>Catacomb Entrance</span>
        </button>

        <!-- Trap Room -->
        <button type="submit" name="terrain" value="trap-room" class="menu-option option-trap-room" title="Draw a Trap card">
          <img src="./images/tiles/dcii6b4-7b7a6615-f179-4783-9a5a-d73c79026d22/01.png" alt="Trap Room">
          <span>Trap Room</span>
        </button>

        <!-- Tower Room -->
        <button type="submit" name="terrain" value="tower-room" class="menu-option option-tower-room" title="Exit if you have Loot cards">
          <img src="./images/tiles/" alt="Tower Room">
          <span>Tower Room</span>
        </button>

        <!-- Chamber of Darkness -->
        <button type="submit" name="terrain" value="chamber-of-darkness" class="menu-option option-chamber-of-darkness" title="Move again randomly">
          <img src="./images/tiles/dchoaub-a8c150c3-f229-4127-a85a-6f23fcef5dfd/11.png" alt="Chamber of Darkness">
          <span>Chamber of Darkness</span>
        </button>

        <!-- Treasure Chamber -->
        <button type="submit" name="terrain" value="treasure-chamber" class="menu-option option-treasure-chamber" title="Draw a Dragon card">
          <img src="./images/tiles/" alt="Treasure Chamber">
          <span>Treasure Chamber</span>
        </button>

        <!-- Corridor -->
        <button type="submit" name="terrain" value="corridor" class="menu-option option-corridor" title="Move again, but not the same Corridor twice">
          <img src="./images/tiles/dchob0p-7a5cac09-3da7-438a-a68b-8feccc017615/05.png" alt="Corridor">
          <span>Corridor</span>
        </button>

        <!-- Chasm -->
        <button type="submit" name="terrain" value="chasm" class="menu-option option-chasm" title="Draw a Dungeon card and choose exit side next turn">
          <img src="./images/tiles/dchv2xb-891ab3f8-1d54-4549-89b9-915907c3f031/11.png" alt="Chasm">
          <span>Chasm</span>
        </button>

        <!-- Cave-in -->
        <button type="submit" name="terrain" value="cave-in" class="menu-option option-cave-in" title="Draw a Dungeon card and choose to retreat or test Agility">
          <img src="./images/tiles/dchv2xb-891ab3f8-1d54-4549-89b9-915907c3f031/10.png" alt="Cave-in">
          <span>Cave-in</span>
        </button>

        <!-- Bridge -->
        <button type="submit" name="terrain" value="bridge" class="menu-option option-bridge" title="Stay or test Agility to cross">
          <img src="./images/tiles/dcizgt9-df025130-02d7-4c89-b78f-f3bbac994e5d/00.png" alt="Bridge">
          <span>Bridge</span>
        </button>

        <!-- Rotating Room -->
        <button type="submit" name="terrain" value="rotating-room" class="menu-option option-rotating-room" title="Rotate the tile 180 degrees">
          <img src="./images/tiles/dchob7c-3d8940d5-e7ed-4e42-8c01-cf9297b17775/09.png" alt="Rotating Room">
          <span>Rotating Room</span>
        </button>
      </div>
      <button type="button" id="menu-cancel" class="cancel-btn">Cancel</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
