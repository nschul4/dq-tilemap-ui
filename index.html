<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Grid Game Architecture Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
    </header>

    <main id="game-board" class="grid-board"></main>
  </div>

        </button>

          <h4>Dungeon Room</h4>
          <div class="tile-variants">
            <button type="submit" name="terrain" value="dungeon-room-variant-1" class="tile-option" title="Dungeon Room Variant 1">

            <button type="submit" name="terrain" value="dungeon-room-variant-2" class="tile-option" title="Dungeon Room Variant 2">

            </button>
            <button type="submit" name="terrain" value="dungeon-room-variant-4" class="tile-option" title="Dungeon Room Variant 4">
