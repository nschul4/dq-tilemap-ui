<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>dq-tilemap-ui</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Viewport clips overflow and captures touch gestures -->
    <div id="map-viewport" class="map-viewport">
      <div id="map-canvas" class="map-canvas">
        <img
          src="./images/original/dcjkc49-ab8e949d-2bbb-430a-a739-4453b836d854.png"
          class="game-background-img"
          alt=""
        />
        <main id="game-board" class="grid-board"></main>
      </div>
    </div>

    <!-- Tile Palette Modal -->
    <dialog id="tile-palette" class="tile-palette">
      <form method="dialog" class="menu-form">
        <h3>Select Tile Variant</h3>
        <div class="options-container" id="options-container">
          <button
            type="submit"
            name="terrain"
            value="unset"
            class="menu-option option-unset"
          >
            <span>Unset Tile</span>
          </button>
        </div>
        <button type="button" id="menu-cancel" class="cancel-btn">
          Cancel
        </button>
      </form>
    </dialog>

    <div id="viewport-controls" class="viewport-controls">
      <button type="button" id="zoom-in-btn" aria-label="Zoom In">+</button>
      <button type="button" id="zoom-out-btn" aria-label="Zoom Out">−</button>
      <button type="button" id="zoom-reset-btn" aria-label="Reset View">
        100%
      </button>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
