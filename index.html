<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dq-tilemap-ui</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
  <div class="game-container">
    <img src="./images/original/dcjkc49-ab8e949d-2bbb-430a-a739-4453b836d854.png" class="game-background-img" alt="">
    <main id="game-board" class="grid-board"></main>
  </div>

  <dialog id="tile-menu" class="centered-menu">
    <form method="dialog" class="menu-form">
      <h3>Modify Tile State</h3>
      <div class="options-container" id="options-container">

        <!-- Static Unset Option -->
        <button type="submit" name="terrain" value="unset" class="menu-option option-unset"
          title="Reset this tile to an unassigned state.">
          <svg class="icon" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11,7H13V11H17V13H13V17H11V13H7V11H11V7Z" />
          </svg>
          <span>Unset</span>
        </button>

        <!-- Dynamic tile categories injected here by app.js -->

      </div>
      <button type="button" id="menu-cancel" class="cancel-btn">Cancel</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>

</body>

</html>
